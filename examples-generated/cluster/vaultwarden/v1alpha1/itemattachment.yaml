apiVersion: vaultwarden.crossplane.io/v1alpha1
kind: ItemAttachment
metadata:
  annotations:
    meta.upbound.io/example-id: vaultwarden/v1alpha1/itemattachment
  labels:
    testing.upbound.io/example-name: certificate
  name: certificate
spec:
  forProvider:
    file: ${path.module}/certs/server.pem
    itemIdSelector:
      matchLabels:
        testing.upbound.io/example-name: server

---

apiVersion: vaultwarden.crossplane.io/v1alpha1
kind: ItemSecureNote
metadata:
  annotations:
    meta.upbound.io/example-id: /v1alpha1/itemattachment
  labels:
    testing.upbound.io/example-name: server
  name: server
spec:
  forProvider:
    name: Web server
