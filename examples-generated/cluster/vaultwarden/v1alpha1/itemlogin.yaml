apiVersion: vaultwarden.crossplane.io/v1alpha1
kind: ItemLogin
metadata:
  annotations:
    meta.upbound.io/example-id: vaultwarden/v1alpha1/itemlogin
  labels:
    testing.upbound.io/example-name: database
  name: database
spec:
  forProvider:
    fields:
    - name: Port
      valueSecretRef:
        key: example-key
        name: example-secret
        namespace: upbound-system
    - name: Recovery code
      type: hidden
      valueSecretRef:
        key: example-key
        name: example-secret
        namespace: upbound-system
    folderIdSelector:
      matchLabels:
        testing.upbound.io/example-name: infrastructure
    name: Database
    notesSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    passwordSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    totpSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    uris:
    - match: host
      uri: https://db.example.com
    username: admin

---

apiVersion: vaultwarden.crossplane.io/v1alpha1
kind: Folder
metadata:
  annotations:
    meta.upbound.io/example-id: /v1alpha1/itemlogin
  labels:
    testing.upbound.io/example-name: infrastructure
  name: infrastructure
spec:
  forProvider:
    name: Infrastructure

---

apiVersion: vaultwarden.crossplane.io/v1alpha1
kind: Organization
metadata:
  annotations:
    meta.upbound.io/example-id: /v1alpha1/itemlogin
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    name: Example

---

apiVersion: vaultwarden.crossplane.io/v1alpha1
kind: OrganizationCollection
metadata:
  annotations:
    meta.upbound.io/example-id: /v1alpha1/itemlogin
  labels:
    testing.upbound.io/example-name: operations
  name: operations
spec:
  forProvider:
    name: Operations
    organizationIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
