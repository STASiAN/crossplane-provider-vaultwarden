apiVersion: vaultwarden.m.crossplane.io/v1alpha1
kind: AccountRegister
metadata:
  annotations:
    meta.upbound.io/example-id: vaultwarden/v1alpha1/accountregister
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    email: foo@example.com
