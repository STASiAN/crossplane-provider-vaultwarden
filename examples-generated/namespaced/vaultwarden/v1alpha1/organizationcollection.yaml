apiVersion: vaultwarden.m.crossplane.io/v1alpha1
kind: OrganizationCollection
metadata:
  annotations:
    meta.upbound.io/example-id: vaultwarden/v1alpha1/organizationcollection
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    name: Example Collection
    organizationIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: vaultwarden.m.crossplane.io/v1alpha1
kind: Organization
metadata:
  annotations:
    meta.upbound.io/example-id: /v1alpha1/organizationcollection
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    name: Example
