apiVersion: vaultwarden.m.crossplane.io/v1alpha1
kind: OrganizationUser
metadata:
  annotations:
    meta.upbound.io/example-id: vaultwarden/v1alpha1/organizationuser
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    email: foo@example.com
    organizationIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    type: User

---

apiVersion: vaultwarden.m.crossplane.io/v1alpha1
kind: Organization
metadata:
  annotations:
    meta.upbound.io/example-id: /v1alpha1/organizationuser
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    name: Example
