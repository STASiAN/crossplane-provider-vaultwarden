apiVersion: vaultwarden.m.crossplane.io/v1alpha1
kind: OrganizationPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: vaultwarden/v1alpha1/organizationpolicy
  labels:
    testing.upbound.io/example-name: master_password
  name: master-password
  namespace: crossplane-system
spec:
  forProvider:
    data: |-
      ${jsonencode({
          minComplexity  = 3
          minLength      = 14
          requireUpper   = true
          requireLower   = true
          requireNumbers = true
          requireSpecial = true
        })}
    enabled: true
    organizationIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    type: master_password

---

apiVersion: vaultwarden.m.crossplane.io/v1alpha1
kind: Organization
metadata:
  annotations:
    meta.upbound.io/example-id: /v1alpha1/organizationpolicy
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    name: Example
