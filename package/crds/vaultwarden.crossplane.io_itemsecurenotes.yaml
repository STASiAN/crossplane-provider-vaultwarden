    schema:
      openAPIV3Schema:
        description: 'ItemSecureNote is the Schema for the ItemSecureNotes API. This
          resource creates a secure note item in the personal vault of the provider
          user or in an organization. The note''s text is the notes attribute. Items
          are encrypted client-side, like Bitwarden clients do: new items get their
          own item key (cipher key), which is encrypted with the key of the provider
          user or of the organization. Updates keep the parts of the item that the
          provider does not manage, such as the password history, passkeys and attachments.
          Deleting the item deletes it permanently, without moving it to the trash.
          Requires email and master_password to be set in the provider configuration.'
